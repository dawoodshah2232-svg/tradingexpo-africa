        "@type": "Answer",
        "text": "The 20/50/200-period EMAs suit most trend work on daily charts; the 200-day SMA is the classic long-term benchmark. 'Best' depends on your market and timeframe — backtest rather than copying someone's settings."

      "@type": "Question",
      "name": "Does the golden cross work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As a late trend-confirmation and regime label, it has historical merit; as a mechanical entry signal it is too lagging to be profitable alone. Use it for context, not triggers."
      }
    },
    {
      "@type": "Question",
      "name": "Why do moving averages fail in sideways markets?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Averages are trend-following by construction — in ranges, price repeatedly crosses a flat average, generating whipsaws. Detect flat-average regimes and switch tactics or stand aside."
      }

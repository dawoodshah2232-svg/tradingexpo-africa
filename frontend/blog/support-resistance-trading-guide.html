      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As few as possible: key daily/weekly zones plus the nearest relevant intraday levels. Three to five zones per chart is plenty — more creates analysis paralysis and post-hoc justification."
      }
    },
    {
      "@type": "Question",
      "name": "Why do round numbers act as support/resistance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because humans anchor on them — orders cluster at round figures, option strikes sit there, and media references them. This clustering of real orders and attention creates genuine supply/demand effects."
      }
    },
    {
      "@type": "Question",
      "name": "What is a false breakout?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A move beyond a level that quickly reverses back inside, trapping breakout traders. Waiting for retests, requiring closes beyond the level, or demanding volume confirmation all help filter them."
      }

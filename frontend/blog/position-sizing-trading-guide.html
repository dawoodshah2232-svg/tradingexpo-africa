      "name": "What is the 1% rule in trading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Risk no more than 1% of your trading capital on a single trade. It ensures that even long losing streaks cause survivable drawdowns rather than account-ending ones."
      }
    },
    {
      "@type": "Question",
      "name": "How do I calculate position size?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Position size = (account × risk%) ÷ (entry price − stop-loss price). The stop distance determines the size — never decide share quantity before knowing your stop."
      }
    },
    {
      "@type": "Question",
      "name": "Should I increase size after winning streaks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fixed-fractional sizing increases size automatically as the account grows. Avoid discretionary size-jumps after wins — overconfidence position-sizing is a classic way to give back streaks."
      }
    }

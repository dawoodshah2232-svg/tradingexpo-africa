      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Date, instrument, setup, entry/stop/target/size, exit, P&L in rupees and R-multiples, chart screenshot, one-sentence thesis, emotional state, and whether you followed your plan."
      }
    },
    {
      "@type": "Question",
      "name": "How often should I review my trading journal?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Weekly for tactical review (60–90 minutes on closed trades by setup), monthly for strategic review (am I trading my best setups? are deviations declining?). Daily logging, weekly reviewing."
      }
    },
    {
      "@type": "Question",
      "name": "Does journaling really improve trading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is the highest-ROI habit in trading: it exposes which setups actually make money, reveals emotional patterns, and enforces accountability. Almost no consistently profitable trader operates without one."

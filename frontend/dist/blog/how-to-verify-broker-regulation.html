      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On the broker's website footer or compliance page. Then verify it independently in the regulator's official register — never trust the number on the broker's site alone."
      }

      "@type": "Question",
      "name": "Can scammers fake a licence number?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes — they copy real numbers onto clone websites. Always cross-check the domain, confirm details via official registers, and call the broker's public phone number to confirm the website."
      }
    },

      "name": "What if a broker is licensed abroad but not in my country?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Foreign licensing does not automatically authorise a broker to serve residents of your country, nor does it give you access to local investor-protection schemes. For your market, local authorisation is what counts."

      "acceptedAnswer": {
        "@type": "Answer",

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Loss aversion: the pain of realising a loss exceeds the pleasure of banking a gain, so you avoid the pain and grab the relief. Mechanical stop/target orders placed at entry bypass this bias."
      }

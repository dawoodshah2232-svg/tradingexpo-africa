      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Using borrowed funds or margin to control a larger position than your capital alone allows. 10x leverage means R10,000 controls R100,000 of exposure — amplifying both profits and losses tenfold."
      }
    },
    {
      "@type": "Question",
      "name": "Why is high leverage dangerous?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because normal market noise becomes fatal: at 100x leverage a 1% adverse move wipes out the position. It demands near-perfect timing while eliminating the room for error beginners need to learn."
      }
    },
    {
      "@type": "Question",
      "name": "How much leverage should a beginner use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "As little as possible — many professionals trade with effective leverage under 3–5x. Master unleveraged or low-leverage trading first; add leverage only when strategy and discipline are proven."
      }
    }

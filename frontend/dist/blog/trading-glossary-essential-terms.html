      "name": "What is the bid-ask spread?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The difference between the highest price buyers will pay (bid) and the lowest price sellers will accept (ask). It is effectively a cost of trading — narrower spreads in liquid instruments mean cheaper trading."
      }
    },
    {
      "@type": "Question",
      "name": "What does R-multiple mean?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your profit or loss expressed in units of the risk you took. Risking R5,000 to make R10,000 is +2R; losing R5,000 is −1R. Professionals evaluate strategies in R, not rupees."
      }
    },
    {
      "@type": "Question",
      "name": "What is slippage?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The difference between the price you expected when placing an order and the price you actually got — common in fast markets and illiquid instruments, and a real cost most beginners underestimate."
      }
    }
  ]

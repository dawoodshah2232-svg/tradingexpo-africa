      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is better than nothing but vulnerable to SIM-swap attacks, where criminals take over your number. Authenticator apps or hardware keys are significantly safer."
      }
    },
    {
      "@type": "Question",
      "name": "Should I keep crypto on the exchange?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Keep only what you actively trade on exchanges. Long-term holdings are safer in self-custody (hardware wallets), since exchange balances depend on the platform's solvency and security."
      }
    },
    {
      "@type": "Question",
      "name": "What is a withdrawal allowlist?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A security setting that restricts withdrawals to pre-approved addresses, usually with a time delay for adding new ones. It means a hacker who breaches your account still cannot send funds to their own wallet."
      }
    }

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can begin learning with modest capital, but position sizing math matters: risking 1% per trade with a R50,000 account means R500 risk per trade, which limits viable setups. Many swing traders find R100,000–200,000 a more practical starting base — see our capital guide for the full breakdown."
      }

      "@type": "Question",
      "name": "Is swing trading better than intraday?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For most people with jobs, yes — it needs minutes per day rather than hours, avoids intraday noise, and lets fundamentals and technicals work together. Intraday suits only those who can commit full screen time."
      }
    },
    {
      "@type": "Question",
      "name": "How many swing positions should I hold?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fewer than you think. Three to six uncorrelated positions let you manage risk properly; twenty positions is a portfolio you cannot monitor and a journal you will never maintain."

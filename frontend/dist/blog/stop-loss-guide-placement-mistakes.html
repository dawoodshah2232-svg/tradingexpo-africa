      "acceptedAnswer": {
        "@type": "Answer",
        "text": "At the price where your trade thesis is invalidated — below support/structure for longs, above for shorts — sanity-checked against 1.5–2x ATR so normal volatility doesn't trigger it."
      }
    },

      "@type": "Question",
      "name": "Should I use a fixed percentage stop-loss?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Fixed percentages ignore market structure and volatility. They are better than no stop, but structure-plus-ATR placement is significantly more effective."
      }
    },

      "@type": "Question",
      "name": "What is a trailing stop?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A stop that moves favourably with price, locking in profits while giving the trade room. Use structure-based trails (below rising swing lows) rather than arbitrary distances for best results."

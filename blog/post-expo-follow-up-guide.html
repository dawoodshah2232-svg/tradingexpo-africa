    {
      "@type": "Question",
      "name": "How many new contacts should I follow up with after an expo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Follow up with everyone you had a meaningful conversation with — usually five to fifteen people, not fifty. A short personalised message within 48 hours beats a mass LinkedIn blast. Prioritise the contacts where you identified a specific reason to stay in touch: a shared interest, a promised introduction, or a question they could help answer."
      }
    },
    {
      "@type": "Question",
      "name": "How soon should I act on a trading idea I picked up at a session?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Test it before you trade it — always. Write down the idea's exact rules, paper-trade or backtest it for at least a few weeks, and only then consider small real-money positions. Ideas heard on stage are starting points for your own validation, never ready-made strategies."
      }
    },
    {
      "@type": "Question",
      "name": "I collected five broker brochures. How do I actually choose?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Build a simple comparison sheet with the same rows for each broker: licence verified, full annual cost for your typical trading pattern, platform quality from the demo, support responsiveness, and product coverage. Score each, then open a demo account with your top choice before committing funds. Decide within two weeks or consciously defer — brochures gathering dust help no one."
      }
    },
    {
      "@type": "Question",
      "name": "How do I know if the expo was worth the time and money?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Write a one-page review within a week: what you learned, which contacts and ideas you are pursuing, and what you will do differently at your trading desk. Revisit it at 30, 60 and 90 days. If the actions you listed produced better decisions, new relationships or avoided mistakes, the expo paid for itself many times over."
      }
    }
  ]
}

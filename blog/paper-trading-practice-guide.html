      "@type": "Question",
      "name": "How long should I paper trade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Until you have 50–100 trades of journaled, rules-following data showing positive expectancy — typically 1–3 months. A lucky fortnight proves nothing."
      }
    },
    {
      "@type": "Question",
      "name": "Why do I fail live after succeeding on paper?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Usually psychology (hesitation, oversizing, moving stops) or unrealistic paper fills (ignoring costs and slippage). Honest paper-trading setup minimises the second; small live size and journaling address the first."

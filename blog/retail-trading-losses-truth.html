      "@type": "Question",
      "name": "What percentage of retail derivatives traders lose money?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Africa's market regulator found that 87.7% of individual equity-derivatives traders incurred net losses in FY26, after costs. Before costs, the share was 82.1% — meaning transaction costs pushed roughly 440,000 traders from profit into loss."
      }
    },
    {
      "@type": "Question",
      "name": "Why do most options buyers lose money?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Studies consistently find the vast majority of retail derivatives traders follow option-buying strategies, which have a negative expected value over time due to time decay and transaction costs. Buying options is renting time at a price that only pays if the market hurries in your direction."
      }
    },
    {
      "@type": "Question",
      "name": "Do trading costs really matter that much?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Enormously. In a major regulator's study, costs turned hundreds of thousands of winning traders into losers. If you do not know your all-in cost per trade, you cannot know whether your strategy has an edge at all."
      }
    }
  ]

      "@type": "Question",
      "name": "How many stocks should a diversified trader hold?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Count risk drivers, not tickers. Five positions across uncorrelated drivers diversify better than twenty stocks in two sectors. For most traders, 4–8 genuinely different exposures is a practical range."
      }
    },
    {
      "@type": "Question",
      "name": "Does diversification reduce returns?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It reduces volatility and tail risk; it can modestly reduce peak returns in raging bull markets. The trade is intentional: smoother compounding and survival through regimes that destroy concentrated books."
      }
    },
    {
      "@type": "Question",
      "name": "Can currency positions diversify my portfolio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes — currency pairs respond to macro drivers (central-bank policy, crude, global dollar) that differ from equity drivers, making them a useful diversification leg. See our USD–INR guide."
      }

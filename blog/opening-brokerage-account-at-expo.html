  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is it safe to submit KYC documents at an expo booth?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only with a licensed, regulated broker, only through their official application (never a staff member's personal phone or link), and never share OTPs with booth staff — enter one-time passwords yourself. If anything about the process feels informal, walk away and complete onboarding from home."
      }
    },
    {
      "@type": "Question",
      "name": "Do expo offers really beat a broker's normal online offers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sometimes, but not automatically. Compare the expo offer against the broker's standard public pricing and against competitors' offers. Pay attention to conditions — waived charges that return after three months, or cashback tied to trading volumes you would never reach, can make a \"deal\" more expensive than the normal plan."
      }
    },
    {
      "@type": "Question",
      "name": "Can I open accounts with more than one broker?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes — investors commonly hold accounts with multiple brokers, for example one for long-term investing and another for intraday trading. Each account needs its own KYC and carries its own charges, so only open as many as you will genuinely use and monitor."
      }
    },
    {
      "@type": "Question",
      "name": "I signed up at an expo and now regret it. What can I do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Do not fund the account, and contact the broker's official customer support (not the booth rep) to close it or put it on hold. You are not obligated to trade just because you opened an account. If you shared documents with an unregistered operator, monitor your credit report and consider filing a complaint with the market regulator."
      }
    }
  ]
}

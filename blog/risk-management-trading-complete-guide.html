      "name": "What is portfolio heat in trading?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The total risk across all open positions, expressed as a percentage of capital. Keeping heat under 5–6% ensures no single market event can inflict catastrophic damage, even if every position fails simultaneously."
      }
    },
    {
      "@type": "Question",
      "name": "How do I handle correlated positions?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Treat correlated positions (same sector, theme or macro driver) as partially one position for risk purposes. Either reduce size on each or diversify across genuinely uncorrelated drivers."
      }
    },
    {
      "@type": "Question",
      "name": "What should I do after hitting my max drawdown?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Stop trading real capital immediately, switch to paper trading, and conduct a structured review of what broke — strategy, discipline or market regime. Resume only with a written diagnosis and fix."
      }

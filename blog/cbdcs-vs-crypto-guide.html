      "@type": "Question",
      "name": "Is a CBDC the same as cryptocurrency?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. A CBDC is issued by a central bank, stable against the national currency, and legal tender. Cryptocurrencies are privately issued, typically volatile, and not legal tender in most countries."
      }
    },
    {
      "@type": "Question",
      "name": "Can I trade a CBDC?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A CBDC is a payment instrument, not a speculative asset — it does not fluctuate against the national currency, so there is nothing to trade. Its significance for traders is infrastructural and regulatory."
      }
    },
    {
      "@type": "Question",
      "name": "Which countries have launched CBDCs?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Several central banks run live CBDCs or advanced pilots, and dozens more are researching them. Timelines are each central bank's decision — follow official announcements rather than speculation."
      }
